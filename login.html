<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css"/>
</head>
<body >
    <section class=" lg:grid lg:grid-cols-2 ">
        
        <img src="./images/LoginPage_Images/background_imgForLogin.webp" class="  max-lg:hidden" />
        <div  class="container flexCol max-sm:mx-auto">

            <div class="mt-16 max-xxs:ml-7.5">
                <h1 class="font-Garamond pb-2 text-black">Welcome Back</h1>
                <p class="max-md:text-[0.813rem] max-xs:text-[0.625rem]">Please enter your details to access your sanctuary.</p>
            
       </div>

       <div class="mb-6 mt-10 max-xs:mr-10">
         <button class="max-xs:ml-24 border-1 border-borderColor gap-1.25 buttonWid "> <img src="./images/LoginPage_Images/google_Icon.svg" class="max-xs:w-3"/> <a href="#">Continue with Google</a> </button>
      </div>
         <p class="text-gray-400 max-md:text-[10px] max-sm:text-[8px]">-------------------OR LOGIN WITH EMAIL-------------------</p>
       
       
         <form class="grid grid-cols-1 mt-2 gap-6">
         <div class="grid grid-cols-1 >  
        <label for="email">Email address</label>
            <input type="email" id="email" placeholder="name@example.com"  class="inputprop"/>
</div> 
<div >
             <label for="Passward" class="flex justify-between">Passward <a href="#"><span class="text-xs text-pink-700">Forgot?</span></a></label>
            <input type="password" id="Passward" placeholder="......." class="inputprop" />
       
        </div>
        <div >
            <button class="bg-interbackground buttonWid border text-amber-50 hover:scale-105 hover:bg-borderColor transition-all duration-200"><a href="./home.html">Login to Glowé</a></button>
        </div>
         </form>
        </div>
    </section>
    
</body>
</html>
